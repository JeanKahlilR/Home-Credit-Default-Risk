services:
  api:
    build: .
    image: credit-risk-api:v1
    container_name: credit-risk-api
    ports:
      - "8000:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - credit-net
    restart: unless-stopped

  frontend:
    build: ./frontend
    image: credit-risk-frontend:v1
    container_name: credit-risk-frontend
    ports:
      - "8501:8501"
    environment:
      - API_URL=http://api:8000
    depends_on:
      api:
        condition: service_healthy
    networks:
      - credit-net
    restart: unless-stopped

networks:
  credit-net:
    driver: bridge
